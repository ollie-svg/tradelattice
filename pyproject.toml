[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradelattice"
version = "0.2.0"
description = "Open data standard and reference stack for coordinating goods and services across a national economy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi",
  "uvicorn",
  "sqlalchemy>=2",
  "jsonschema",
  "httpx",
  "python-multipart",
]

[project.scripts]
tradelattice-api = "tradelattice.api.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
docs = ["mkdocs<2", "mkdocs-material"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tradelattice.spec" = ["schemas/*.json", "examples/*.json"]
"tradelattice.connectors" = ["*/sample/*.csv", "*/fixtures/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--import-mode=importlib"
