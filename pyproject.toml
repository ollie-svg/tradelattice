[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradelattice"
version = "0.1.0"
description = "Open data standard and reference stack for coordinating goods and services across a national economy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi",
  "uvicorn",
  "sqlalchemy>=2",
  "jsonschema",
  "httpx",
  "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
docs = ["mkdocs<2", "mkdocs-material"]

[tool.setuptools]
packages = ["spec", "connectors", "api"]

[tool.setuptools.package-data]
spec = ["schemas/*.json", "examples/*.json"]
connectors = ["*/sample/*.csv"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests", "api", "connectors", "spec"]
